        hackP: `Hackerspaces (auch Hackspace oder Hackerspace) sind community-betriebene Räume, in denen Technik­begeisterte, Programmierer und Kreative zusammenkommen. Der Begriff „Hacker" meint hier konstruktiven Umgang mit Technik – nicht Kriminalität. Typische Themen sind Elektronik, Software, Open Source, 3D-Druck, Heimautomatisierung und digitale Kunst.`,
        diffH: `Was ist der Unterschied?`,
        diffP: `Die Begriffe überschneiden sich erheblich. Viele Spaces nennen sich Makerspace, bieten aber die gleiche Ausstattung wie ein FabLab. Hackerspaces sind oft etwas computerlastiger, während FabLabs mehr auf physische Fertigung fokussieren. In der Praxis sind alle drei Konzepte Varianten desselben Gedankens: offener Raum, gemeinschaftliches Wissen, selbst machen.`,

        makerH: `What is a Makerspace?`,
        makerP: `A makerspace is an open workshop where people work together on projects, bring ideas to life and learn from each other. Typical equipment includes 3D printers, laser cutters, CNC routers, electronics tools and sewing machines. Makerspaces are often run as non-profit associations and are open to the public – sometimes for a small membership fee.`,
        fablabH: `What is a FabLab?`,
        fablabP: `FabLab (Fabrication Laboratory) is a concept pioneered by MIT professor Neil Gershenfeld for open labs with standardised equipment: laser cutter, vinyl cutter, 3D printer, CNC mill and electronics workshop. Official FabLabs are members of the global FabLab network and commit to openness and knowledge sharing.`,
        hackH: `What is a Hackerspace?`,
        hackP: `Hackerspaces (also hackspace or hackerspace) are community-operated spaces where technology enthusiasts, programmers and creatives come together. "Hacker" here means constructive engagement with technology – not criminality. Typical topics are electronics, software, open source, 3D printing, home automation and digital art.`,
        diffH: `What is the difference?`,
        diffP: `The terms overlap considerably. Many spaces call themselves makerspaces but offer the same equipment as a FabLab. Hackerspaces tend to be more computer-focused, while FabLabs focus more on physical fabrication. In practice all three concepts are variations of the same idea: open space, shared knowledge, do-it-yourself.`,

        makerH: `Qu'est-ce qu'un Makerspace ?`,
        makerP: `Un makerspace est un atelier ouvert où les gens travaillent ensemble sur des projets, concrétisent des idées et apprennent les uns des autres. L'équipement typique comprend des imprimantes 3D, des découpeuses laser, des fraiseuses CNC, des outils électroniques et des machines à coudre. Les makerspaces sont souvent gérés en tant qu'associations à but non lucratif et sont ouverts au public.`,
        fablabH: `Qu'est-ce qu'un FabLab ?`,
        fablabP: `FabLab (Fabrication Laboratory) est un concept développé par le professeur Neil Gershenfeld du MIT pour des laboratoires ouverts avec un équipement standardisé : découpeuse laser, traceur de découpe, imprimante 3D, fraiseuse CNC et atelier électronique. Les FabLabs officiels sont membres du réseau mondial FabLab.`,
        hackH: `Qu'est-ce qu'un Hackerspace ?`,

        diffH: `Quelle est la différence ?`,

        lead: `makerspac.es is een interactieve kaart van alle makerspaces, FabLabs en hackerspaces in Duitsland, Oostenrijk, Zwitserland en andere Europese landen – met live open/gesloten status.`,
        makerH: `Wat is een Makerspace?`,
        makerP: `Een makerspace is een open werkplaats waar mensen samenwerken aan projecten, ideeën realiseren en van elkaar leren. Typische uitrusting omvat 3D-printers, lasersnijders, CNC-freesmachines, elektronicatools en naaimachines. Makerspaces zijn vaak georganiseerd als non-profit vereniging en staan open voor het publiek.`,

        hackH: `Wat is een Hackerspace?`,
        hackP: `Hackerspaces zijn gemeenschapsgeleide ruimtes waar techneuten, programmeurs en creatieven samenkomen. "Hacker" betekent hier constructief omgaan met technologie. Typische onderwerpen zijn elektronica, software, open source en 3D-printen.`,
        diffH: `Wat is het verschil?`,
        diffP: `De termen overlappen aanzienlijk. Veel spaces noemen zichzelf makerspace maar bieden dezelfde uitrusting als een FabLab. In de praktijk zijn alle drie concepten variaties van hetzelfde idee: open ruimte, gedeelde kennis, zelf doen.`,
        ctaText: `Alle spaces op de kaart vinden →`,
        footerText: `Kaart van alle makerspaces, FabLabs en hackerspaces in Europa.`,
      },
      it: {
        lang: `it`,
        title: `Cosa sono i Makerspace, FabLab e Hackerspace?`,
        metaDesc: `Makerspace, FabLab e Hackerspace spiegati: officine aperte e laboratori comunitari dove le persone collaborano creativamente.`,
        lead: `makerspac.es è una mappa interattiva di tutti i makerspace, FabLab e hackerspace in Germania, Austria, Svizzera e altri paesi europei – con stato aperto/chiuso in tempo reale.`,
        makerH: `Cos'è un Makerspace?`,
        makerP: `Un makerspace è un'officina aperta dove le persone lavorano insieme su progetti, realizzano idee e imparano le une dalle altre. L'attrezzatura tipica include stampanti 3D, tagliatrici laser, fresatrici CNC, strumenti elettronici e macchine da cucire. I makerspace sono spesso organizzati come associazioni no-profit e sono aperti al pubblico.`,
        fablabH: `Cos'è un FabLab?`,
        fablabP: `FabLab (Fabrication Laboratory) è un concetto sviluppato dal professor Neil Gershenfeld del MIT per laboratori aperti con attrezzatura standardizzata: tagliatrice laser, tagliatrice in vinile, stampante 3D, fresatrice CNC e laboratorio elettronico. I FabLab ufficiali sono membri della rete mondiale FabLab.`,
        hackH: `Cos'è un Hackerspace?`,
        hackP: `Gli hackerspace sono spazi gestiti dalla comunità dove si riuniscono appassionati di tecnologia, programmatori e creativi. "Hacker" indica qui un approccio costruttivo alla tecnologia. I temi tipici includono elettronica, software open source, stampa 3D e arte digitale.`,
        diffH: `Qual è la differenza?`,
        diffP: `I termini si sovrappongono notevolmente. In pratica tutti e tre i concetti sono variazioni della stessa idea: spazio aperto, conoscenza condivisa, fare da sé.`,
        ctaText: `Trova tutti gli spazi sulla mappa →`,
        footerText: `Mappa di tutti i makerspace, FabLab e hackerspace in Europa.`,
      },
      da: {
        lang: `da`,
        title: `Hvad er Makerspaces, FabLabs og Hackerspaces?`,
        metaDesc: `Makerspaces, FabLabs og Hackerspaces forklaret: åbne værksteder og fællesskabslaboratorier, hvor mennesker samarbejder kreativt.`,
        lead: `makerspac.es er et interaktivt kort over alle makerspaces, FabLabs og hackerspaces i Tyskland, Østrig, Schweiz og andre europæiske lande – med live åben/lukket status.`,
        makerH: `Hvad er et Makerspace?`,
        makerP: `Et makerspace er et åbent værksted, hvor mennesker arbejder sammen om projekter, realiserer idéer og lærer af hinanden. Typisk udstyr omfatter 3D-printere, lasersnittere, CNC-fræsere, elektronikværktøj og symaskiner. Makerspaces er ofte organiseret som non-profit foreninger og er åbne for offentligheden.`,
        fablabH: `Hvad er et FabLab?`,
        fablabP: `FabLab (Fabrication Laboratory) er et koncept udviklet af MIT-professor Neil Gershenfeld for åbne laboratorier med standardiseret udstyr: laserskærer, vinylskærer, 3D-printer, CNC-fræse og elektronikværksted. Officielle FabLabs er medlemmer af det globale FabLab-netværk.`,
        hackH: `Hvad er et Hackerspace?`,
        hackP: `Hackerspaces er fællesskabsdrevne rum, hvor teknologiinteresserede, programmører og kreative mødes. "Hacker" betyder her konstruktiv omgang med teknologi. Typiske emner er elektronik, software, open source og 3D-print.`,
        diffH: `Hvad er forskellen?`,
        diffP: `Begreberne overlapper i høj grad. I praksis er alle tre koncepter variationer af den samme idé: åbent rum, delt viden, gør-det-selv.`,
        ctaText: `Find alle spaces på kortet →`,
        footerText: `Kort over alle makerspaces, FabLabs og hackerspaces i Europa.`,
      },
      uk: {
        lang: `uk`,
        title: `Що таке Makerspace, FabLab та Hackerspace?`,
        metaDesc: `Makerspace, FabLab та Hackerspace: відкриті майстерні та спільноти де люди творчо співпрацюють.`,
        lead: `makerspac.es — інтерактивна карта всіх makerspace, FabLab та hackerspace у Німеччині, Австрії, Швейцарії та інших європейських країнах — з поточним статусом відкрито/закрито.`,
        makerH: `Що таке Makerspace?`,
        makerP: `Makerspace — це відкрита майстерня, де люди спільно працюють над проектами, втілюють ідеї та навчаються одне від одного. Типове обладнання включає 3D-принтери, лазерні різаки, фрезери з ЧПУ, інструменти для електроніки та швейні машини. Makerspaceи часто організовані як некомерційні об'єднання та відкриті для всіх.`,
        fablabH: `Що таке FabLab?`,
        fablabP: `FabLab (Fabrication Laboratory) — концепція, розроблена професором MIT Нілом Ґершенфелдом, для відкритих лабораторій зі стандартизованим обладнанням: лазерний різак, різак для вінілу, 3D-принтер, фрезер з ЧПУ та електронна майстерня. Офіційні FabLab є членами глобальної мережі FabLab.`,
        hackH: `Що таке Hackerspace?`,
        hackP: `Hackerspaceи — це простори, якими керує спільнота, де збираються ентузіасти технологій, програмісти та творчі люди. «Хакер» тут означає конструктивний підхід до технологій. Типові теми: електроніка, програмне забезпечення з відкритим кодом, 3D-друк та цифрове мистецтво.`,
        diffH: `У чому різниця?`,
        diffP: `Поняття значно перетинаються. На практиці всі три концепції є варіаціями однієї ідеї: відкритий простір, спільні знання, зроби сам.`,
        ctaText: `Знайти всі простори на карті →`,
        footerText: `Карта всіх makerspace, FabLab та hackerspace в Європі.`,
      },
    };

    function getLang() {
      try {
        const stored = localStorage.getItem('preferred_language');
        if (stored && i18n[stored]) return stored;
      } catch (e) {}
      const browser = (navigator.language || 'de').slice(0, 2);
      return i18n[browser] ? browser : 'de';
    }

    function setLang(code) {
      try { localStorage.setItem('preferred_language', code); } catch (e) {}
      render();
    }

    // Country → map hash
    const ccToHash = {
      DE: 'germany', AT: 'austria', CH: 'switzerland',
      NL: 'netherlands', BE: 'belgium', LU: 'luxembourg',
      IT: 'italy', DK: 'denmark', UA: 'ukraine', GB: 'united-kingdom',
    };
    const langToHash = {
      de: 'germany', en: 'germany', fr: 'switzerland',
      nl: 'netherlands', it: 'italy', da: 'denmark', uk: 'ukraine',
    };

    function getCountryHash() {
      const parts = (navigator.language || '').split('-');
      if (parts.length >= 2) {
        const cc = parts[parts.length - 1].toUpperCase();
        if (ccToHash[cc]) return ccToHash[cc];
      }
      return langToHash[getLang()] || 'germany';
    }

    document.getElementById('map-bg').src = '/#/' + getCountryHash();

    function render() {
      const lang = getLang();
      const t = i18n[lang];

      document.documentElement.lang = t.lang;
      document.title = t.title + ' – makerspac.es';
      document.querySelector('meta[name="description"]').content = t.metaDesc;
      document.querySelector('meta[property="og:description"]').content = t.metaDesc;
      document.querySelector('meta[property="og:title"]').content = t.title;

      document.querySelectorAll('#lang-flags .fi').forEach(el => {
        el.classList.toggle('active', el.dataset.lang === lang);
      });

      document.getElementById('content').innerHTML = `
        <h1>${t.title}</h1>
        <p class="lead">${t.lead}</p>
        <h2>${t.makerH}</h2>
        <p>${t.makerP}</p>
        <h2>${t.fablabH}</h2>
        <p>${t.fablabP}</p>
        <h2>${t.hackH}</h2>
        <p>${t.hackP}</p>
        <h2>${t.diffH}</h2>
        <p>${t.diffP}</p>
        <a href="/" class="cta">${t.ctaText}</a>
      `;

      document.getElementById('footer-text').textContent = t.footerText;
    }

    render();

    document.getElementById('lang-flags').addEventListener('click', function(e) {
      const el = e.target.closest('[data-lang]');
      if (el) setLang(el.dataset.lang);
    });
  </script>
</body>
