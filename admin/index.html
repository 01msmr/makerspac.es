<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin – Review</title>
  <link rel="stylesheet" href="/main-layout.css">
  <link rel="stylesheet" href="/main-responsive.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header id="bar">
    <nav id="tabs" hidden>
      <button id="tab-spaceapi" data-kind="spaceapi">SpaceAPI</button>
      <button id="tab-workshops" data-kind="workshops">Workshops</button>
      <button id="tab-calendar" data-kind="calendar">Kalender</button>
      <button id="tab-weekly" data-kind="weekly">Treffen</button>
    </nav>
    <button id="tab-problems" data-problems hidden title="Fehlgeschlagene Läufe und hängende Vorschläge">Probleme</button>
    <span id="counter"></span>
    <span id="data-stand" title="Zeitpunkt und Commit des angezeigten „bei uns“-Stands"></span>
    <button id="refresh" hidden title="„bei uns“ neu von GitHub laden">↻</button>
    <span class="grow"></span>
    <button id="apply" hidden></button>
    <button id="logout" hidden title="Meldet dich ab und löscht den Token aus diesem Browser">abmelden</button>
  </header>

  <section id="login" hidden>
    <p>Fine-grained PAT (nur <code>01msmr/makerspac.es</code>, Issues R/W + Actions R/W):</p>
    <input id="token" type="password" autocomplete="off" placeholder="github_pat_…">
    <button id="save-token">Speichern</button>
  </section>

  <main id="review" hidden>
    <section id="left">
      <h2 id="title"></h2>
      <div id="problem" hidden></div>
      <table id="compare"></table>
      <p id="hint"></p>
      <form id="edit">
        <input id="edit-input" required>
        <fieldset id="edit-ws">
          <legend>Workshops</legend>
          <div id="edit-checks"></div>
          <label for="edit-free" id="edit-free-label">Freitext — hier Text einfügen (wird sofort ausgewertet) oder eine URL</label>
          <textarea id="edit-free" rows="3" placeholder="Text oder URL einfügen — Text: erkannte Typen werden angehakt · URL: „Website auslesen (Server)“ liest sie serverseitig aus"></textarea>
          <button type="button" id="edit-scan" title="Liest die Website des Spaces (oder die oben eingefügte URL) serverseitig per GitHub-Workflow aus, ca. 30–60 s. Der eingefügte Text wird dafür nicht verwendet.">Website auslesen (Server)</button>
          <small id="scan-target"></small>
          <p id="edit-detected" data-state="idle"></p>
        </fieldset>
        <label id="replace-wrap" hidden><input type="checkbox" id="edit-replace"> <span id="replace-text"></span></label>
        <label id="remove-wrap" hidden><input type="checkbox" id="edit-remove"> <span id="remove-text"></span></label>
        <p id="empty-hint" hidden></p>
        <button>Speichern + ok</button>
        <small>Änderungen werden erst mit <kbd>y</kbd> / „Speichern + ok“ ins Issue geschrieben; das Issue bleibt offen, bis übernommen wird (Auto / „Übernehmen“).</small>
      </form>
      <div id="actions">
        <button type="button" id="act-y" data-tone="ok"><kbd>y</kbd> ok</button>
        <button type="button" id="act-n" data-tone="no"><kbd>n</kbd> ablehnen</button>
        <button type="button" id="act-l" data-tone="warn"><kbd>l</kbd> später</button>
        <button type="button" id="act-z" data-tone="neutral" disabled><kbd>z</kbd> rückgängig</button>
      </div>
      <p id="keys"><kbd>Esc</kbd> Änderungen verwerfen · <kbd>j</kbd> Website · <kbd>k</kbd> Endpoint/Kalender</p>
      <p id="status" role="status"></p>
      <div id="extra"></div>
    </section>
    <section id="right">
      <div id="viewbar">
        <button id="show-site">Website</button>
        <button id="show-endpoint">Endpoint</button>
        <button id="open-tab">im Tab öffnen</button>
      </div>
      <iframe id="frame" title="Vorschau" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    </section>
  </main>

  <section id="inbox" hidden></section>

  <p id="done" hidden></p>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="admin.js"></script>
</body>
</html>
