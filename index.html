<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <title>makerspac.es – Makerspaces, FabLabs &amp; Hackerspaces</title>
  <meta name="description" content="Karte aller Makerspaces, FabLabs und Hackerspaces in Deutschland, Österreich und der Schweiz – mit Live-Status." />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <!-- status-bar-style wird von iOS NUR ausgewertet, wenn capable="yes" gesetzt ist —
       ohne capable fällt iOS auf eine System-eigene, opake Statusbar zurück
       (unabhängig von Light/Dark Mode der Seite, wirkt wie ein dunkler Balken über der Karte). -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- Chrome/Android: Standardname (apple-… ist dort deprecated), iOS braucht weiterhin die apple-Variante -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/android-chrome-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/android-chrome-512x512.png" />
  <link rel="manifest" href="icons/site.webmanifest" />

  <!-- Preload kritische Ressourcen (parallel zum HTML-Parsen) -->
  <link rel="preload" href="fonts/Roboto-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="libs/fontawesome/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin />
  <!-- Data split preload: map.js erkennt Country aus URL-Hash und fügt <link rel=preload> ein -->
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />

  <!-- CSS-Ladestrategie: blockierend nur, was der erste Paint braucht (leaflet, Icon-Font, main-layout inkl. Skeleton,
       main-responsive, search). Alles andere lädt mit media="print"→"all" nicht-blockierend (Reihenfolge im Cascade
       bleibt die Dokumentreihenfolge). Neue Regeln für Elemente im statischen HTML → in eine blockierende Datei. -->
  <!-- Bibliotheks-CSS -->
  <link rel="stylesheet" href="libs/leaflet/leaflet.css" />
  <link rel="stylesheet" href="libs/leaflet-markercluster/MarkerCluster.css" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="libs/leaflet-markercluster/MarkerCluster.Default.css" media="print" onload="this.media='all'" />
  <!-- maplibre-gl.css: lazy-loaded in tile-loader.js only when WebGL/vector mode is active -->
  <link rel="stylesheet" href="libs/microtip.css" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="libs/flag-icons/css/flag-icons.min.css" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="libs/fontawesome/css/subset.min.css" />

  <!-- App CSS -->
  <link rel="stylesheet" href="main-layout.css" />
  <link rel="stylesheet" href="main-components.css" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="main-responsive.css" />
  <link rel="stylesheet" href="listing-core.css" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="search.css" />
  <link rel="stylesheet" href="nearby.css" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="styles-autocomplete.css" media="print" onload="this.media='all'" />

  <script>
    // Promise: alle nicht-blockierenden Stylesheets angewendet (load oder error → nie hängen bleiben); map.js wartet darauf
    window.__cssReady = Promise.all([].map.call(document.querySelectorAll('link[rel=stylesheet][media=print]'), function (l) {
      return new Promise(function (r) {
        if (l.media === 'all') return r();
        l.addEventListener('load', r); l.addEventListener('error', r);
      });
    }));
  </script>
  <noscript>
    <link rel="stylesheet" href="libs/leaflet-markercluster/MarkerCluster.css" />
    <link rel="stylesheet" href="libs/leaflet-markercluster/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="libs/microtip.css" />
    <link rel="stylesheet" href="libs/flag-icons/css/flag-icons.min.css" />
    <link rel="stylesheet" href="main-components.css" />
    <link rel="stylesheet" href="listing-core.css" />
    <link rel="stylesheet" href="nearby.css" />
    <link rel="stylesheet" href="styles-autocomplete.css" />
  </noscript>

  <!-- Bibliotheks-JS: defer → paralleler Download, Ausführung nach DOM-Parsing -->
  <script defer src="libs/leaflet/leaflet.js"></script>
  <script defer src="libs/leaflet-markercluster/leaflet.markercluster.js"></script>
  <!-- maplibre-gl.js + leaflet-maplibre-gl.js: lazy-loaded in map.js only when WebGL/vector mode is active -->
  <script defer src="libs/qrcode.min.js"></script>

  <!-- modulepreload: flacht den ES-Modul-Wasserfall (map.js → 3 Import-Ebenen) ab; Liste = Import-Graph von map.js,
       bei neuen/entfernten Imports mitpflegen (siehe architektur.md) -->
  <link rel="modulepreload" href="config.js" />
  <link rel="modulepreload" href="routing.js" />
  <link rel="modulepreload" href="bookmark-manager.js" />
  <link rel="modulepreload" href="spaceapi-static.js" />
  <link rel="modulepreload" href="i18n.js" />
  <link rel="modulepreload" href="datasync.js" />
  <link rel="modulepreload" href="zoom-manager.js" />
  <link rel="modulepreload" href="data-store.js" />
  <link rel="modulepreload" href="main.js" />
  <link rel="modulepreload" href="popup-builder.js" />
  <link rel="modulepreload" href="embed-overlay.js" />
  <link rel="modulepreload" href="app-context.js" />
  <link rel="modulepreload" href="tile-loader.js" />
  <link rel="modulepreload" href="data-preload.js" />
  <link rel="modulepreload" href="toast.js" />
  <link rel="modulepreload" href="error-monitor.js" />
  <link rel="modulepreload" href="marker-manager.js" />
  <link rel="modulepreload" href="demo-mode.js" />
  <link rel="modulepreload" href="colours.js" />
  <link rel="modulepreload" href="filter-config.js" />
  <link rel="modulepreload" href="search-filter.js" />
  <link rel="modulepreload" href="listing-core.js" />
  <link rel="modulepreload" href="search-header.js" />
  <link rel="modulepreload" href="workshop-types.js" />
  <link rel="modulepreload" href="nearby-header.js" />
  <link rel="modulepreload" href="date-utils.js" />
  <link rel="modulepreload" href="mobile-filter.js" />
  <link rel="modulepreload" href="add-space-form.js" />
  <link rel="modulepreload" href="search-pills.js" />
  <link rel="modulepreload" href="autocomplete-manager.js" />

  <!-- Früher Start: Daten-Preload + MapLibre-Laden. Klassisches Inline-Script mit dynamic import() läuft SOFORT beim
       Parsen — ein <script type="module"> wäre deferred und liefe erst nach CSS + defer-Libs (gemessen: ~5,7 s statt
       ~0,2 s bei Slow-4G). tile-loader.js wartet vor dem Plugin selbst auf Leaflet. map.js init() erhält später
       dasselbe Promise (idempotent). -->
  <script>
    import('./data-preload.js').then(m => m.preloadInitialData()).catch(() => {});
    import('./tile-loader.js').then(m => m.loadMaplibreIfNeeded()).catch(() => {}); // Fehler behandelt map.js init() erneut
  </script>

  <!-- App-JS: map.js als ES Module (importiert alle App-Module) -->
  <script type="module" src="map.js"></script>

  <!-- JSON-LD: WebApplication -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "makerspac.es",
    "url": "https://makerspac.es",
    "description": "Karte aller Makerspaces, FabLabs und Hackerspaces in Deutschland, Österreich und der Schweiz – mit Live-Status.",
    "applicationCategory": "Map",
    "inLanguage": ["de", "en", "fr", "nl", "it", "da", "uk"]
  }
  </script>

  <!-- Hide title-bar when app is embedded as iframe backdrop -->
  <script>if (window !== window.top) document.documentElement.classList.add('in-iframe');</script>

  <!-- Service Worker registrieren -->
  <script>
    if ('serviceWorker' in navigator) {
      // Nach 'load' registrieren: der SW-Install precacht ~55 Dateien und soll nicht mit dem ersten Laden konkurrieren
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').then(reg => {
        // iOS PWA: periodisch auf Updates prüfen (alle 5 Min)
        // Kein window.location.reload() bei updatefound — würde bei jedem Deployment
        // einen Reload-Loop auf aktiven Clients auslösen. skipWaiting() im SW selbst
        // sorgt dafür dass der neue SW beim nächsten Seitenaufruf aktiv wird.
        setInterval(() => reg.update(), 5 * 60_000);
      }));
    }
  </script>

</head>

<body>
  <!-- Loading-Skeleton: statisch, damit er ab dem ersten Paint sichtbar ist (nicht erst nach dem Modul-Graph).
       Entfernt wird er vom Inline-Script darunter beim ersten filterResultsChanged. Texte: bewusst fest (i18n lädt erst später). -->
  <div id="loading-backdrop" class="map-backdrop show" style="--backdrop-opacity:0.3;--backdrop-duration:1s;z-index:9998"></div>
  <div id="loading-stack" class="loading-overlay-stack">
    <div class="loading-overlay-toast loading-overlay-toast--large show"><i class="fas fa-cog fa-spin"></i> Karte wird geladen…</div>
    <div class="loading-overlay-toast show">Makerspaces werden vorbereitet…</div>
  </div>
  <script>
    // Dismissal liegt bewusst hier (nicht in map.js): Markup und Entfernen bleiben versionsgleich, auch wenn
    // der Service Worker noch ein älteres map.js ausliefert (HTML network-first, JS cache-first).
    document.addEventListener('filterResultsChanged', function () {
      var backdrop = document.getElementById('loading-backdrop');
      var stack = document.getElementById('loading-stack');
      if (backdrop) { backdrop.classList.add('fade-out'); setTimeout(function () { backdrop.remove(); }, 1000); }
      if (stack) {
        stack.querySelectorAll('.loading-overlay-toast').forEach(function (t) { t.classList.remove('show'); t.classList.add('zoom-out'); });
        setTimeout(function () { stack.remove(); }, 300);
      }
    }, { once: true });
  </script>
  <div id="map"></div>

  <div class="title-bar">
    <a href="./">
      <div class="title">📍maker<span class="frame"><span class="spac">spac</span><span
            class="smaller">.es</span></span><span class="tool-add">+</span>
      </div>
    </a>
  </div>


  <!-- Treffer-Zähler in der Kartenansicht (nur Phone, rechts unten); Tippen löscht den Suchtext (nicht die Filter) -->
  <button type="button" class="map-counter" id="map-counter" aria-live="polite"></button>

  <!-- search bar container -->
  <div class="search-container">
    <div class="search-input-row">
      <div class="filter-btn-area">
        <button id="filter-toggle-btn" class="filter-toggle-btn" aria-label="Filter">
          <i class="fas fa-filter"></i>
        </button>
      </div>
      <div id="filter-active-indicator" class="filter-active-indicator"></div>
      <div class="search-input-wrapper">
        <i class="fas fa-magnifying-glass search-lupe" aria-hidden="true"></i>
        <input type="text" id="search-bar" placeholder="" autocomplete="off" spellcheck="false">
        <script>
          // Desktop: Suchleiste sofort fokussieren, Eingabe funktioniert schon vor dem Laden der Module.
          // Bedingung wie SearchHeader.focusSearchBarIfDesktop() (search-header.js) — dort mitpflegen.
          if (!/[?&]nofocus\b/.test(location.search) &&
              !matchMedia('(max-width: 1024px), (min-width: 768px) and (pointer: coarse)').matches) {
            document.getElementById('search-bar').focus();
          }
        </script>
        <div class="search-counter" id="search-counter">0</div>
      </div>
    </div>
    <div class="dropdown-wrap">
      <div id="dropdown-nav" class="dropdown-nav">
        <button id="map-zoom-out-btn" class="map-zoom-out-btn" aria-label="Herauszoomen"><i class="fas fa-compress"></i></button>
        <button class="dropdown-nav-btn" id="dropdown-nav-up" aria-label="Seite hoch"><i
            class="fas fa-angle-up"></i></button>
        <button class="dropdown-nav-btn" id="dropdown-nav-down" aria-label="Seite runter"><i
            class="fas fa-angle-down"></i></button>
        <button class="dropdown-nav-btn search-open-btn" id="search-open-btn" aria-label="Suche"><i
            class="fas fa-magnifying-glass"></i></button>
        <script>
          // Phone: Suche reagiert sofort (vor den Modulen): Eingabezeile einblenden (ohne Auto-Fokus/Tastatur).
          // Sobald MobileFilterUI geladen ist, bindet dessen init() den Button selbst (öffnet zusätzlich das Filter-Pane).
          document.getElementById('search-open-btn').addEventListener('click', function () {
            if (window.mobileFilterUI) return;
            document.querySelector('.search-container').classList.add('search-open');
          });
        </script>
      </div>
      <div class="dropdown-main">
        <div id="mobile-active-filters" class="mobile-active-filters"></div>
        <div id="suggestions-dropdown"></div>
      </div>
    </div>
  </div>


</body>

</html>
