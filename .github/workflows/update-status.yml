name: "🔄 push status.json 2 srv"

on:
  schedule:
    - cron: '*/30 * * * *'   # Fallback alle 30 Min (primär via cron-job.de alle 15 Min)
  workflow_dispatch:          # von cron-job.de und manuell auslösbar

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: SpaceAPI Status abrufen
        run: node fetch-spaceapi-status.js

      - name: status.json zu Netcup hochladen (FTP via curl)
        env:
          FTP_HOST: ${{ secrets.NETCUP_FTP_HOST }}
          FTP_USER: ${{ secrets.NETCUP_FTP_USER }}
          FTP_PASS: ${{ secrets.NETCUP_FTP_PASSWORD }}
        run: |
          curl --ipv4 -T status.json \
            -u "$FTP_USER:$FTP_PASS" \
            "ftp://$FTP_HOST/status.json" \
            --ssl --insecure --ftp-pasv \
            --silent --show-error --retry 3 --retry-delay 10
