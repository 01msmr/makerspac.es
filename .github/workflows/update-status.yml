name: "🔄 push status.json > netcup > ms > httpd"

on:
  schedule:
    - cron: '*/20 * * * *'   # alle 20 Minuten
  workflow_dispatch:          # auch manuell auslösbar

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: SpaceAPI Status abrufen
        run: node fetch-spaceapi-status.js

      - name: Prüfen ob status.json verändert wurde
        id: check
        run: |
          if git diff --quiet status.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Keine Änderungen in status.json"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "status.json wurde aktualisiert"
          fi

      - name: status.json zu Netcup hochladen (FTP via curl)
        if: steps.check.outputs.changed == 'true'
        env:
          FTP_HOST: ${{ secrets.NETCUP_FTP_HOST }}
          FTP_USER: ${{ secrets.NETCUP_FTP_USER }}
          FTP_PASS: ${{ secrets.NETCUP_FTP_PASSWORD }}
        run: |
          curl --ipv4 -T status.json \
            -u "$FTP_USER:$FTP_PASS" \
            "ftp://$FTP_HOST/status.json" \
            --ftp-pasv \
            --silent --show-error

      - name: status.json ins Repo committen
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "🤖 Update status.json [skip ci]"
          git push
