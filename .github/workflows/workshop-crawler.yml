name: "🔍 Workshop Crawler"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modus"
        required: true
        default: "research"
        type: choice
        options:
          - research        # Analyse + neue Typen erkennen, keine Issues
          - create-issues   # Issues erstellen + loc-enrichment.json aktualisieren
      limit:
        description: "Nur N Spaces (leer = alle)"
        required: false
        default: ""
      id:
        description: "Nur Space mit dieser ID"
        required: false
        default: ""

permissions:
  issues: write    # gh issue create

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Argumente zusammenbauen
        id: args
        run: |
          ARGS="--${{ inputs.mode }}"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.id }}" ]; then ARGS="$ARGS --id ${{ inputs.id }}"; fi
          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Label sicherstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create "workshop-data" --description "Workshop equipment data for a makerspace" --color "0075ca" 2>/dev/null || true

      - name: Crawler ausführen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/workshop-crawler.js ${{ steps.args.outputs.args }}

