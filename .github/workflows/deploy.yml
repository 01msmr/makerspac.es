name: Deploy to gitHub Pages

on:
  # Alle 12 Minuten ausführen, WENN Änderungen verfügbar sind
  schedule:
    - cron: '*/12 * * * *'
  
  # Manuell auslösen
  workflow_dispatch:
  
  # Bei Push (zum Testen)
  push:
    branches: [ main ]

# Wichtig: Rechte für GitHub Pages und Repository
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Repository auschecken
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # 2. Node.js einrichten
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'
      
      # 3. SpaceAPI Status aktualisieren
      - name: Fetch SpaceAPI Status
        run: node fetch-spaceapi-status.js
      
      # 6. GitHub Pages einrichten
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      # 7. Build-Artefakte hochladen
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Ordner, der veröffentlicht werden soll (anpassen!)
          path: '.'
      
      # 8. Zu GitHub Pages deployen
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
