name: Deploy to gitHub Pages

on:
  # Alle 12 Minuten SpaceAPI pruefen — Deploy nur bei Aenderungen
  schedule:
    - cron: '*/12 * * * *'

  # Manuell ausloesen — deployt immer
  workflow_dispatch:

  # Bei Code-Aenderungen auf main — deployt immer
  push:
    branches: [ main ]

# Wichtig: Rechte fuer GitHub Pages und Repository
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository auschecken
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Node.js einrichten
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      # 3. SpaceAPI Status aktualisieren
      - name: Fetch SpaceAPI Status
        run: node fetch-spaceapi-status.js

      # 4. Pruefen ob Deploy noetig ist
      - name: Check if deploy needed
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
            echo "Deploy: ja (Trigger: ${{ github.event_name }})"
          elif git diff --quiet status.json 2>/dev/null; then
            echo "deploy=false" >> $GITHUB_OUTPUT
            echo "Deploy: nein (keine SpaceAPI-Aenderungen)"
          else
            echo "deploy=true" >> $GITHUB_OUTPUT
            echo "Deploy: ja (SpaceAPI-Aenderungen erkannt)"
          fi

      # 5. GitHub Pages einrichten
      - name: Setup Pages
        if: steps.check.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      # 6. Build-Artefakte hochladen
      - name: Upload artifact
        if: steps.check.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      # 7. Zu GitHub Pages deployen
      - name: Deploy to GitHub Pages
        if: steps.check.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
