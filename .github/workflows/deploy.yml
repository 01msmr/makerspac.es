name: "🚀 Deploy to Netcup"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write   # für git tag --push nach erfolgreichem Deploy

jobs:
  deploy:
    # [skip ci] Commits (z.B. status.json-Updates) nicht deployen
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (mit vollständiger History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # alle Commits + Tags

      - name: Basis-SHA ermitteln (last-deployed Tag oder HEAD~1)
        id: base
        run: |
          if git rev-parse last-deployed >/dev/null 2>&1; then
            BASE=$(git rev-parse last-deployed)
            echo "Basis: last-deployed ($BASE)"
          else
            BASE=$(git rev-parse HEAD~1)
            echo "Basis: HEAD~1 ($BASE) — erster Deploy"
          fi
          echo "sha=$BASE" >> $GITHUB_OUTPUT

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JSON-Splits generieren
        run: node generate-map-splits.js

      - name: Split-Dateien zu Netcup hochladen
        env:
          FTP_HOST: ${{ secrets.NETCUP_FTP_HOST }}
          FTP_USER: ${{ secrets.NETCUP_FTP_USER }}
          FTP_PASS: ${{ secrets.NETCUP_FTP_PASSWORD }}
        run: |
          # data/-Verzeichnis auf Server anlegen
          curl --ipv4 \
            -u "$FTP_USER:$FTP_PASS" \
            "ftp://$FTP_HOST/data/" \
            --ftp-create-dirs \
            --ssl --insecure --ftp-pasv \
            --silent --show-error \
            -Q "CWD /data" 2>/dev/null || true

          for file in data/markers.json data/spaces-*.json data/splits-manifest.json; do
            [ -f "$file" ] || continue
            echo "Uploading: $file"
            curl --ipv4 -T "$file" \
              -u "$FTP_USER:$FTP_PASS" \
              "ftp://$FTP_HOST/$file" \
              --ftp-create-dirs \
              --ssl --insecure --ftp-pasv \
              --silent --show-error
          done

      - name: SW-Version aktualisieren (max 1x täglich)
        run: |
          LAST=$(git log -1 --format="%as" -- sw.js 2>/dev/null || echo "1970-01-01")
          TODAY=$(date +%Y-%m-%d)
          if [ "$LAST" != "$TODAY" ]; then
            CURRENT=$(sed -n "s/const VERSION = 'v\([0-9]*\)'.*/\1/p" sw.js)
            NEW=$((CURRENT + 1))
            sed -i "s/const VERSION = 'v${CURRENT}'/const VERSION = 'v${NEW}'/" sw.js
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sw.js
            git commit -m "bump SW version v${CURRENT} → v${NEW} [skip ci]"
            git push
            echo "✅ SW version bumped: v${CURRENT} → v${NEW}"
          else
            echo "ℹ️ SW version bereits heute aktualisiert (letzter Stand: $LAST)"
          fi

      - name: Geänderte Dateien ermitteln
        id: changed
        run: |
          git diff --name-only ${{ steps.base.outputs.sha }} HEAD -- . \
            | grep -v '^\.github/' \
            | grep -v '^_OLD/' \
            | grep -vE '\.(md|py|afdesign)$' \
            | grep -v '^sitemap\.xml$' \
            | grep -v '^locations\.json$' \
            > changed_files.txt || true
          cat changed_files.txt
          echo "count=$(wc -l < changed_files.txt)" >> $GITHUB_OUTPUT

      - name: Dateien zu Netcup hochladen
        if: steps.changed.outputs.count > 0
        env:
          FTP_HOST: ${{ secrets.NETCUP_FTP_HOST }}
          FTP_USER: ${{ secrets.NETCUP_FTP_USER }}
          FTP_PASS: ${{ secrets.NETCUP_FTP_PASSWORD }}
        run: |
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && echo "Gelöscht (übersprungen): $file" && continue

            # Verzeichnis auf Server anlegen falls nötig
            dir=$(dirname "$file")
            if [ "$dir" != "." ]; then
              curl --ipv4 \
                -u "$FTP_USER:$FTP_PASS" \
                "ftp://$FTP_HOST/$dir/" \
                --ftp-create-dirs \
                --ssl --insecure --ftp-pasv \
                --silent --show-error \
                -Q "CWD /$dir" 2>/dev/null || true
            fi

            echo "Uploading: $file"
            curl --ipv4 -T "$file" \
              -u "$FTP_USER:$FTP_PASS" \
              "ftp://$FTP_HOST/$file" \
              --ftp-create-dirs \
              --ssl --insecure --ftp-pasv \
              --silent --show-error
          done < changed_files.txt

      - name: last-deployed Tag aktualisieren
        if: steps.changed.outputs.count > 0
        run: |
          git tag -f last-deployed
          git push origin -f refs/tags/last-deployed
