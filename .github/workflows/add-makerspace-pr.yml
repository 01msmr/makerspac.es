name: "➕ Makerspace PR Generator"

on:
  issues:
    types: [labeled]

jobs:
  create-pr:
    if: github.event.label.name == 'add-space'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Process Issue and Update JSON
        id: update_script
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const body = context.payload.issue.body || "";

            // Debug: Log the entire body
            console.log("=== ISSUE BODY START ===");
            console.log(body);
            console.log("=== ISSUE BODY END ===");

            // Einfaches, zuverlässiges Parsing ohne Regex
            // GitHub Issue Forms erzeugen: "### Label\n\nWert\n\n### Nächstes Label..."

            function parseFormFields(body) {
              const fields = {};
              const lines = body.split('\n');

              let currentLabel = null;
              let currentValue = [];

              for (const line of lines) {
                // Neuer Header gefunden?
                if (line.startsWith('### ')) {
                  // Vorherigen Wert speichern
                  if (currentLabel) {
                    fields[currentLabel] = currentValue.join('\n').trim();
                  }
                  // Neuen Header starten
                  currentLabel = line.substring(4).trim();
                  currentValue = [];
                } else if (currentLabel) {
                  // Zeile zum aktuellen Wert hinzufügen
                  currentValue.push(line);
                }
              }

              // Letzten Wert speichern
              if (currentLabel) {
                fields[currentLabel] = currentValue.join('\n').trim();
              }

              return fields;
            }

            const fields = parseFormFields(body);

            // Debug: Alle gefundenen Felder ausgeben
            console.log("=== PARSED FIELDS ===");
            for (const [key, value] of Object.entries(fields)) {
              console.log(`[${key}] = "${value}"`);
            }
            console.log("=== END PARSED FIELDS ===");

            // Felder direkt auslesen (exakte Label-Namen aus dem Formular)
            function getField(label, fallback = "") {
              const value = fields[label];
              if (!value || value === "_No response_" || value === "None") {
                return fallback;
              }
              return value;
            }

            function getNumber(label, fallback = 0) {
              const value = getField(label, "");
              if (!value) return fallback;
              // Komma zu Punkt für deutsche Zahlenformate
              const num = parseFloat(value.replace(',', '.'));
              return isNaN(num) ? fallback : num;
            }

            function getInt(label, fallback = 0) {
              const value = getField(label, "");
              if (!value) return fallback;
              const num = parseInt(value, 10);
              return isNaN(num) ? fallback : num;
            }

            // Pflichtfelder prüfen
            const name = getField("Name des Makerspaces");
            const country = getField("Land");
            const city = getField("Stadt");
            const lat = getNumber("Latitude (Breitengrad)");
            const long = getNumber("Longitude (Längengrad)");

            if (!name) {
              core.setFailed("Fehler: Name des Makerspaces fehlt!");
              return;
            }
            if (!country) {
              core.setFailed("Fehler: Land fehlt!");
              return;
            }
            if (!city) {
              core.setFailed("Fehler: Stadt fehlt!");
              return;
            }
            if (lat === 0 || long === 0) {
              core.setFailed("Fehler: Koordinaten fehlen oder sind ungültig! (lat=" + lat + ", long=" + long + ")");
              return;
            }

            // locations.json laden
            let locations = JSON.parse(fs.readFileSync('locations.json', 'utf8'));

            // ID Management (Template an Index 0)
            const nextId = parseInt(locations[0].ID);
            core.setOutput('next_id', nextId);
            locations[0].ID = nextId + 1;

            // Neuen Eintrag erstellen
            const newEntry = {
              "name": name,
              "ID": nextId,
              "loc": {
                "lat": lat,
                "long": long,
                "plz": getInt("PLZ"),
                "city": city,
                "street": {
                  "name": getField("Straße"),
                  "number": getField("Hausnummer"),
                  "ext": getField("Adress-Zusatz")
                },
                "country": country
              },
              "style": getField("Kategorie / Style", "for all"),
              "link": {
                "url": getField("Webseite (URL)"),
                "text": getField("Link-Anzeigetext")
              }
            };

            // SpaceAPI nur hinzufügen, wenn URL vorhanden
            const spaceapi = getField("SpaceAPI Endpoint (Optional)");
            if (spaceapi && spaceapi.startsWith('http')) {
              newEntry.spaceapi = { "endpoint": spaceapi };
            }

            // Datum (Format: YYYYMMDD)
            const today = parseInt(new Date().toISOString().slice(0, 10).replace(/-/g, ''));
            newEntry.dates = {
              "space.init": today,
              "datacheck.latest": today
            };

            // Debug: Neuen Eintrag ausgeben
            console.log("=== NEW ENTRY ===");
            console.log(JSON.stringify(newEntry, null, 2));
            console.log("=== END NEW ENTRY ===");

            // Einfügeposition finden (sortiert nach Land > PLZ > Name)
            let dataOnly = locations.slice(1);
            let insertIndex = dataOnly.length;

            for (let i = 0; i < dataOnly.length; i++) {
              const item = dataOnly[i];

              const cComp = (item.loc?.country || "").localeCompare(newEntry.loc.country);
              if (cComp > 0) { insertIndex = i; break; }

              if (cComp === 0) {
                const pComp = (item.loc?.plz || 0) - newEntry.loc.plz;
                if (pComp > 0) { insertIndex = i; break; }

                if (pComp === 0) {
                  const nComp = (item.name || "").localeCompare(newEntry.name);
                  if (nComp > 0) { insertIndex = i; break; }
                }
              }
            }

            // Einfügen
            dataOnly.splice(insertIndex, 0, newEntry);

            // Speichern
            const finalData = [locations[0], ...dataOnly];
            fs.writeFileSync('locations.json', JSON.stringify(finalData, null, 2));

            // Ausgabe für Titel
            core.setOutput('space_name', name);

            console.log(`✅ Space "${name}" mit ID ${nextId} an Position ${insertIndex + 1} eingefügt.`);

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add makerspace: ${{ steps.update_script.outputs.space_name }} (ID ${{ steps.update_script.outputs.next_id }})"
          title: "➕ Neuer Space: ${{ steps.update_script.outputs.space_name }} (ID: ${{ steps.update_script.outputs.next_id }})"
          branch: "add-space-id-${{ steps.update_script.outputs.next_id }}"
          base: main
          delete-branch: true
          body: |
            Automatischer PR für den Makerspace: **${{ steps.update_script.outputs.space_name }}**
            Zugewiesene ID: `${{ steps.update_script.outputs.next_id }}`

            Basierend auf Issue #${{ github.event.issue.number }}
          labels: automated-pr

      - name: Feedback Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            🚀 Ein Pull Request wurde erstellt!

            **Space:** ${{ steps.update_script.outputs.space_name }}
            **ID:** ${{ steps.update_script.outputs.next_id }}
