name: "➕ Makerspace PR Generator"

on:
  issues:
    types: [labeled]

jobs:
  create-pr:
    if: github.event.label.name == 'add-space'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Issue Parser
        run: npm install @github/issue-parser

      - name: Process Issue and Update JSON
        id: update_script
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { parseIssue } = require('@github/issue-parser');
            
            try {
              // 1. Issue parsen
              const issueBody = context.payload.issue.body;
              const template = fs.readFileSync('.github/ISSUE_TEMPLATE/add-makerspace.yml', 'utf8');
              const parsed = parseIssue(issueBody, template);
              
              // Hilfsfunktion: Holt Text sicher ab oder gibt Leerstring zurück
              const getVal = (id) => (parsed[id] && parsed[id].text) ? parsed[id].text.trim() : "";

              // 2. locations.json laden
              let locations = JSON.parse(fs.readFileSync('locations.json', 'utf8'));
              
              // 3. ID Management
              const nextId = parseInt(locations[0].ID);
              core.setOutput('next_id', nextId);
              locations[0].ID = nextId + 1;
              
              // 4. Neues Objekt bauen
              const newEntry = {
                name: getVal('name') || "Unbenannter Space",
                ID: nextId,
                loc: {
                  lat: parseFloat(getVal('lat')) || 0,
                  long: parseFloat(getVal('long')) || 0,
                  plz: parseInt(getVal('plz')) || 0,
                  city: getVal('city'),
                  street: {
                    name: getVal('street_name'),
                    number: getVal('street_number'),
                    ext: getVal('street_ext')
                  },
                  country: getVal('country')
                },
                style: getVal('style'),
                link: {
                  url: getVal('url'),
                  text: getVal('url_text')
                },
                dates: {
                  "space.init": parseInt(new Date().toISOString().slice(0,10).replace(/-/g, '')),
                  "datacheck.latest": parseInt(new Date().toISOString().slice(0,10).replace(/-/g, ''))
                }
              };
              
              const sApi = getVal('spaceapi');
              if (sApi.startsWith('http')) {
                newEntry.spaceapi = { endpoint: sApi };
              }

              // 5. Daten extrahieren (ohne Template)
              let dataOnly = locations.slice(1);
              
              // 6. Die richtige Position finden (Splicing-Logik)
              let insertIndex = dataOnly.length; // Standard: am Ende einfügen
              
              for (let i = 0; i < dataOnly.length; i++) {
                const item = dataOnly[i];
                
                // Vergleichswerte (Normalisiert auf Kleinbuchstaben für sauberes Sortieren)
                const cComp = (item.loc?.country || "").localeCompare(newEntry.loc.country);
                
                if (cComp > 0) { 
                  insertIndex = i; 
                  break; 
                } else if (cComp === 0) {
                  // Wenn Land gleich, prüfe PLZ
                  const pComp = (item.loc?.plz || 0) - newEntry.loc.plz;
                  if (pComp > 0) { 
                    insertIndex = i; 
                    break; 
                  } else if (pComp === 0) {
                    // Wenn PLZ auch gleich, prüfe Name
                    if ((item.name || "").localeCompare(newEntry.name) > 0) {
                      insertIndex = i;
                      break;
                    }
                  }
                }
              }

              // 7. Einfügen
              dataOnly.splice(insertIndex, 0, newEntry);

              // 8. Final speichern
              const finalData = [locations[0], ...dataOnly];
              fs.writeFileSync('locations.json', JSON.stringify(finalData, null, 2));
              
              console.log(`✅ Erfolgreich an Index ${insertIndex} eingefügt.`);
              
            } catch (error) {
              console.error(error);
              core.setFailed("Skriptfehler: " + error.message);
            }

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add makerspace ID ${{ steps.update_script.outputs.next_id }}"
          title: "➕ Neuer Space: ${{ github.event.issue.title }} (ID: ${{ steps.update_script.outputs.next_id }})"
          branch: "add-space-id-${{ steps.update_script.outputs.next_id }}"
          base: main
          delete-branch: true
          body: |
            Automatischer PR für Issue #${{ github.event.issue.number }}.
            ID: ${{ steps.update_script.outputs.next_id }}
          labels: automated-pr

      - name: Add Feedback Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: "🚀 Pull Request mit der ID **${{ steps.update_script.outputs.next_id }}** wurde erstellt!"