name: Update SpaceAPI Status

on:
  # update every 10 minutes
  schedule:
    - cron: '*/10 * * * *'
  
  # trigger manually
  workflow_dispatch:
  
  # on push (for testing)
  push:
    branches: [ main ]

# ✨ (with permissions)
permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout Repository
      - name: Checkout
        uses: actions/checkout@v3
        with:
          # ✨ NEU: Token mit Schreibrechten
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      # 3. Fetch SpaceAPI Status
      - name: Fetch SpaceAPI Status
        run: node fetch-spaceapi-status.js
      
      # 4. Commit & Push
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add status.json
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Update SpaceAPI status [skip ci]"
      
      # ✨ push with gitHub token
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
