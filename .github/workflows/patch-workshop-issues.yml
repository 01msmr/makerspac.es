name: "🔧 Patch Workshop Issues (add approval checkbox)"

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Add approval checkbox to existing issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/patch-workshop-issues.js
