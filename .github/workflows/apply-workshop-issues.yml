name: "✅ Apply Workshop Issues"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      mode:
        description: "Modus"
        required: true
        type: choice
        options:
          - "dry-run"
          - "apply"
        default: "dry-run"
      id:
        description: "Einzelne Space-ID (0 = alle)"
        required: false
        type: number
        default: 0

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'workshop-data'
    permissions:
      issues: write
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Apply Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "issues" ]; then
            # Triggered by workshop-data label — always apply, extract ID from title
            TITLE="${{ github.event.issue.title }}"
            SPACE_ID=$(echo "$TITLE" | grep -oP '(?<=#)\d+(?=\))')
            ARGS="--apply"
            if [ -n "$SPACE_ID" ]; then
              ARGS="$ARGS --id $SPACE_ID"
            fi
          else
            if [ "${{ inputs.mode }}" = "apply" ]; then
              ARGS="$ARGS --apply"
            fi
            if [ "${{ inputs.id }}" != "0" ]; then
              ARGS="$ARGS --id ${{ inputs.id }}"
            fi
          fi
          echo "Running: node tools/apply-workshop-issues.js $ARGS"
          node tools/apply-workshop-issues.js $ARGS

      - name: Commit loc-enrichment.json
        if: inputs.mode == 'apply' || github.event_name == 'issues'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add loc-enrichment.json
          git diff --staged --quiet || git commit -m "data: apply workshop data from issues"
          git push
