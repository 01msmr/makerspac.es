# Zweck:  Setzt dates["space.edited.latest"] (Berliner Datum, YYYYMMDD) beim MERGE eines Add-Space-PRs (Branch add-space-id-*).
# Update-Formular-Änderungen stempelt update-makerspace-pr.yml selbst (direkter Commit, kein PR); Admin-Übernahmen stempeln die Apply-Skripte.
# Bot-Commits lösen weder CI noch Deploy aus → Validierung hier, Deploy explizit (ADR-007).

name: "🕒 Stamp Edit Date"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: data-apply
  cancel-in-progress: false

jobs:
  stamp:
    if: ${{ github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'add-space-id-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Stamp space.edited.latest
        id: stamp
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          ID="${BRANCH#add-space-id-}"
          node --input-type=module -e "
            import { stampLocationsFile } from './tools/lib/edit-stamp.js';
            const n = stampLocationsFile('locations.json', [Number(process.argv[1])]);
            console.log('gestempelt:', n);
          " "$ID"

      - name: Validate
        uses: ./.github/actions/validate-data

      - name: Commit + Deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add locations.json
          if git diff --staged --quiet; then
            echo "Nichts zu ändern"
          else
            git commit -m "data: space.edited.latest nach Merge von ${{ github.event.pull_request.head.ref }}"
            git pull --rebase origin main
            git push
            gh workflow run deploy.yml --repo ${{ github.repository }}
          fi
