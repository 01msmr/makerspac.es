name: "✅ Validate & Test"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    # Bot-PRs (Update-Formular) hat der Update-Workflow VOR dem PR schon geprüft (validate-data) und mergt sofort —
    # der PR-Check würde nur doppelt prüfen und bricht bei sofortigem Merge ohne Jobs ab (ADR-007). Bei push/dispatch ist head_ref leer → läuft.
    if: ${{ !startsWith(github.head_ref, 'update-space-id-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Daten + Tests prüfen (npm run validate:ci)
        uses: ./.github/actions/validate-data
