name: Generate Sitemap

# Automatische Sitemap-Generierung bei jedem Push
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'locations.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if sitemap-relevant data changed
        id: relevance
        if: github.event_name != 'workflow_dispatch'
        run: |
          python3 << 'PYEOF'
          import json, subprocess, os
          def extract(src):
            data = json.loads(src)
            return sorted([(d.get('name'), d.get('ID'), d.get('loc',{}).get('country'), d.get('loc',{}).get('city')) for d in data])
          old = subprocess.run(['git', 'show', 'HEAD~1:locations.json'], capture_output=True, text=True).stdout
          new = open('locations.json').read()
          relevant = extract(old) != extract(new)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f'relevant={str(relevant).lower()}\n')
          print(f"Sitemap-relevante Aenderungen: {'ja' if relevant else 'nein (nur weekly/dates/spaceapi)'}")
          PYEOF

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' || steps.relevance.outputs.relevant == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate sitemap.xml
        if: github.event_name == 'workflow_dispatch' || steps.relevance.outputs.relevant == 'true'
        run: |
          python3 generate_sitemap.py
          echo "Sitemap generated successfully"
        working-directory: ${{ github.workspace }}

      - name: Check if sitemap changed
        if: github.event_name == 'workflow_dispatch' || steps.relevance.outputs.relevant == 'true'
        id: check_changes
        run: |
          git diff --quiet sitemap.xml || echo "changed=true" >> $GITHUB_OUTPUT
        working-directory: ${{ github.workspace }}

      - name: Commit and push sitemap
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sitemap.xml
          git commit -m "🤖 Update sitemap.xml [skip ci]"
          git push
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No changes
        if: steps.relevance.outputs.relevant == 'false'
        run: echo "Keine Sitemap-relevanten Aenderungen, uebersprungen."
