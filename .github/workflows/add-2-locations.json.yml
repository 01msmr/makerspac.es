- name: Process Issue and Update JSON
        id: update_script
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { parseIssue } = require('@github/issue-parser');
            
            const issueBody = context.payload.issue.body;
            const template = fs.readFileSync('.github/ISSUE_TEMPLATE/add-makerspace.yml', 'utf8');
            const parsed = parseIssue(issueBody, template);
            
            let locations = JSON.parse(fs.readFileSync('locations.json', 'utf8'));
            
            const nextId = parseInt(locations[0].ID);
            // Wir "exportieren" die ID für spätere Schritte:
            core.setOutput('next_id', nextId); 
            
            locations[0].ID = nextId + 1;
            
            // 4. Neues Objekt bauen
            const newEntry = {
              name: parsed.name.text,
              ID: nextId,
              loc: {
                lat: parseFloat(parsed.lat.text),
                long: parseFloat(parsed.long.text),
                plz: parseInt(parsed.plz.text),
                city: parsed.city.text,
                street: {
                  name: parsed.street_name.text,
                  number: parsed.street_number.text,
                  ext: parsed.street_ext ? parsed.street_ext.text : ""
                },
                country: parsed.country.text
              },
              style: parsed.style.text,
              link: {
                url: parsed.url.text,
                text: parsed.url_text.text
              },
              dates: {
                "space.init": parseInt(new Date().toISOString().slice(0,10).replace(/-/g, '')),
                "datacheck.latest": parseInt(new Date().toISOString().slice(0,10).replace(/-/g, ''))
              }
            };
            
            if (parsed.spaceapi && parsed.spaceapi.text.startsWith('http')) {
              newEntry.spaceapi = { endpoint: parsed.spaceapi.text };
            }
            
            // 5. Array Management
            let dataOnly = locations.slice(1);
            dataOnly.push(newEntry);
            
            // 6. Sortieren
            dataOnly.sort((a, b) => {
              if (a.loc.country !== b.loc.country) return a.loc.country.localeCompare(b.loc.country);
              if (a.loc.plz !== b.loc.plz) return a.loc.plz - b.loc.plz;
              return a.name.localeCompare(b.name);
            });
            
            const finalData = [locations[0], ...dataOnly];
            fs.writeFileSync('locations.json', JSON.stringify(finalData, null, 2));

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "add makerspace: ${{ github.event.issue.title }}"
          title: "➕ Neuen Space hinzufügen: ${{ github.event.issue.title }}"
          body: |
            Dieser PR wurde automatisch erstellt, nachdem das Issue #${{ github.event.issue.number }} mit `add-space` gelabelt wurde.
            
            **Prüfung:**
            - [ ] ID wurde von ${{ github.event.issue.number }} übernommen?
            - [ ] Sortierung in der JSON korrekt?
            
            Schließe diesen PR ab, um den Space auf die Karte zu bringen.
          branch: "add-space-branch-${{ github.event.issue.number }}"
          base: main  # Das Ziel ist dein Hauptbranch
          delete-branch: true # Branch nach Merge löschen
          labels: |
             automated-pr

      - name: Add Comment to Issue
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: "🚀 Ich habe einen Pull Request erstellt, um diesen Space hinzuzufügen. Bitte prüfe den PR und merge ihn!"
